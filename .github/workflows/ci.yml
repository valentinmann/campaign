name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; no job here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every broken configuration, not just the first one to fail.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Process start-up, file replacement and path quoting all differ
          # between platforms, and this package depends on all three.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The end-to-end SLURM tests need bash, and skip without it. Here a
      # missing bash must fail the job instead: a skip would turn green.
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml
        env:
          CAMPAIGN_REQUIRE_BASH: "1"

      # An artifact name must be unique within a run unless `overwrite` is set,
      # so the name carries the job and the matrix index.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.job }}-${{ strategy.job-index }}
          path: coverage.xml
          if-no-files-found: error

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

  build:
    name: package builds and validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate metadata
        run: twine check --strict dist/*

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install dist/*.whl
          /tmp/fresh/bin/campaign --version

  demo:
    name: demo runs, then resumes with nothing to do
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo]"

      # Exits non-zero unless every one of the 80 runs meets every invariant.
      - name: Run the campaign
        run: campaign run demo/sir.yaml

      - name: Run it again, which must simulate nothing and change nothing
        run: |
          cp results/sir/results.csv /tmp/first.csv
          campaign run demo/sir.yaml | tee /tmp/second.txt
          grep -q "80 already done, 0 to run" /tmp/second.txt
          cmp results/sir/results.csv /tmp/first.csv

      - name: Draw the figure
        run: |
          python demo/plot.py --out /tmp/peak_infection.png
          test -s /tmp/peak_infection.png
