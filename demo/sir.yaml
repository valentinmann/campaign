# An SIR epidemic with one intervention: contacts are cut by 60% on a given
# day. The campaign sweeps how transmissible the disease is against how soon
# the cut comes, and asks what that does to the peak of infection.
#
#   campaign run demo/sir.yaml
#   python demo/plot.py
name: sir-intervention
model: sir.py:simulate
seed: 20260928
output: ../results/sir

grid:
  # Per day. With gamma = 0.1, R0 = beta / gamma runs from 1.5 to 6.
  beta: {start: 0.15, stop: 0.6, num: 10}
  # The day contacts are cut.
  t_intervention: [5, 10, 15, 20, 30, 45, 60, 90]

constants:
  gamma: 0.1               # recovery rate per day: ten days infectious on average
  reduction: 0.6           # share of contacts the intervention removes
  population: 1.0e6
  initial_infected: 10.0
  t_end: 365.0             # days

workers: 4

# The first run of this file failed 11 of the 80 runs on non-negativity and
# monotonicity, and none on conservation, which held to 1.2e-15 relative. The
# cause was the sampling, not the model: with an absolute tolerance of 1e-6
# persons the solver stopped resolving infection once it fell below that and
# took steps weeks long, and the samples, read off the interpolant between
# those steps, wobbled by a few units in the last place of S and R and by
# 2e-8 persons in I. At the solver's own steps every series was monotone and
# positive. sir.py now integrates with 1e-12, and the checks carry no
# allowance for the integrator:
#
#   conservation to 1e-12 relative, a thousand times the measured drift;
#   non-negativity exactly, and I never falls below 2e-9 persons;
#   monotonicity to 1e-9 persons, which is float64's resolution for numbers
#   of size 1e6, about eight units in the last place. Late in the epidemic S
#   and R move by less than one unit in the last place between samples, so an
#   exact check would be decided by rounding, and rounding differs between
#   the BLAS libraries of different platforms.
#
# A one-person bug is at least a million times the loosest of these, and
# tests/test_demo.py plants three and sees each one caught.
invariants:
  - {check: finite, series: [S, I, R]}
  - {check: conserved, series: [S, I, R], rtol: 1e-12}
  - {check: nonnegative, series: [S, I, R]}
  - {check: monotone, series: S, direction: decreasing, atol: 1e-9}
  - {check: monotone, series: R, direction: increasing, atol: 1e-9}
